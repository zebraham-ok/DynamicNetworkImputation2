# SampleSetting multi-config sampling training — config file
# =========================================
# Phase 1: first mode trained from scratch → save static_encoder as the shared backbone
# Phase 2: remaining modes load the backbone and freeze it, training only temporal_encoder + edge_predictor

# ---- Basic settings ----
defaults:
  config: fusion_film             # default model config name; any file under Models/configs/: gatgru_vec (GAT-GRU, 1-layer BiGRU, paper main model) | gatgru_1dire (GAT-GRU, unidirectional) | bigru_vec (Node-GRU) | egcn (EvolveGCN-H) | tna_vec (TNA) | seal (Temp-SEAL, different forward signature => uses SEALTrainer) | fusion_temporal_injection (fusion opt.3, temporal injection => run with -s fusion_temporal_injection) | fusion_film (fusion opt.4, FiLM => run with -s fusion_film)
  device: auto                   # auto / cuda / cpu
  backbone_donor: 0              # mode index of the backbone donor (0-based)
  seed: 42                       # global random seed of the first repeat
  repeats: 4                     # number of repeated runs (seed ensemble); repeat k uses seed+k.
                                 #   1 = single run, historical layout (output written directly into
                                 #   results/<subdir>/sampling_<timestamp>/, no seed* level).
                                 #   N > 1 = each repeat gets results/.../sampling_<timestamp>/seed<seed>/
                                 #   with its own backbone.pth, and the run root gets an aggregate
                                 #   summary.yaml (mean ± 95% CI over repeats).
                                 #   command-line --repeats / --seed override these values
  rotate_donor: true             # shift the mode order by one every repeat so that every mode
                                 #   supplies the shared backbone exactly once (and is a frozen
                                 #   recipient in the other repeats): removes the systematic
                                 #   advantage of the mode picked by backbone_donor.
                                 #   Only has an effect when repeats > 1; command-line
                                 #   --rotate_donor / --no_rotate_donor override this value.
  resume: null                   # resume: path to an existing output directory (skips completed modes)
                                 #   e.g.: results/gatgru/sampling_<timestamp>
                                 #   command-line --resume overrides this value

# ---- Negative-sampling modes ----
# The mode name spells the three switches in order: filter_factset_neg / intra_industry_neg / use_pred_neg
#   ftt = no factset filter, intra-industry, CSV predefined negatives ON
#   ftf = no factset filter, intra-industry, CSV predefined negatives OFF
#   fff = no factset filter, purely random,   CSV predefined negatives OFF
#   tff = factset filter,   purely random,    CSV predefined negatives OFF
# use_pred_neg=true injects the CSV predefined negatives (Data/stopped_neg_sample.csv) before the
# split and distributes them 8:1:1 over the negatives (0.8 train pool / 0.1 val / 0.1 test). The
# val/test fixed negatives are used in every mode; only the CSV share depends on this switch.
sampling_modes:
  # - name: ftt
  #   desc: "filter_factset=false, intra_industry=true, use_pred_neg=true (CSV negatives ON)"
  #   filter_factset_neg: false
  #   intra_industry_neg: true
  #   use_pred_neg: true

  - name: ftf
    desc: "filter_factset=false, intra_industry=true, use_pred_neg=false (CSV negatives OFF)"
    filter_factset_neg: false
    intra_industry_neg: true
    use_pred_neg: false

  - name: fff
    desc: "filter_factset=false, intra_industry=false, use_pred_neg=false (purely random negatives)"
    filter_factset_neg: false
    intra_industry_neg: false
    use_pred_neg: false

  # - name: fft
  #   desc: "filter_factset=false, intra_industry=false, use_pred_neg=true"
  #   filter_factset_neg: false
  #   intra_industry_neg: false
  #   use_pred_neg: true

# ---- Model parameter overrides (optional) ----
# The command-line --num_rnn_layers overrides the value here.
# Note: enabling num_rnn_layers=2 yields the GAT-GRU* in Appendix A.3 tab:ablation
# (two BiGRU layers), not the 1-layer GAT-GRU in the main table tab:results; keep it commented when reproducing the main results.
model_overrides:
  # num_rnn_layers: 2         # enabling this reproduces GAT-GRU* (two BiGRU layers)
  # static_hidden_dim: 192
  # dynamic_hidden_dim: 96
  # dropout: 0.4
  # heads: 6

# ---- Output settings ----
output:
  root: results                   # results root directory, relative to the repo root
  subdir: fusion_film                  # model subdirectory
  prefix: sampling                # output directory prefix → sampling_{timestamp}[_rnnN]
