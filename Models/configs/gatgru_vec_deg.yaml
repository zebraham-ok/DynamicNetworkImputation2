# ============================================================
# GAT-GRU-Vec + degree channel
# 实验 A（唯一变量）：dataset.use_attr_degree = true -> X 末尾多一列 log(1+degree)
# Deep-merged on top of Training/common_config.yaml (Training/config_loader.load_config)
# ============================================================
# 2026-09-16 二次更新：度通道已改回 common_config.yaml 的默认 **关闭**（opt-in），
# 因此本 config **再次**是唯一的度开关：与基线 gatgru_vec.yaml 只差 `use_attr_degree`，
# 2×2 恢复为 2×2（度 on/off × up/down）；"度关"的对照格就是基线 gatgru_vec.yaml 本身。
# 性质说明：它是"标签可分离性探针"，不是可选模型（泄漏实测：单列
# min(log1p(deg_u),log1p(deg_v)) 当分数就有 AUC 0.984，与该模型 AUC 同量级，
# 见 common_config.yaml 该键注释与 TechnicalGuide §3.5）。绝不能进论文结果表。
#
# 与 gatgru_vec.yaml 的差别只有一处：`dataset.use_attr_degree: true`
#   X = [embedding(128) | one-hot(country|industry_2nd|category_3rd) | log1p(degree)]
#   = 701 -> 702。架构、传播方向、训练协议全部不变，因此两份 run 只差这一列。
#
# 为什么需要它：本项目所有聚合器都是 mean 类（GAT = softmax 加权平均），对邻域基数不变，
# 只能表达"邻域构成比例"，表达不了"有多少个邻居"；度只能靠显式通道喂进去。
#
# 跑之前必读（TechnicalGuide.md §3.5）：
#   * degree = (source, target, year) 三元组在两端分别计数的次数，受 source_filter 约束，
#     与 min_degree 过滤用的是同一个量（同尺度）。2026-09-17 起它是**运行期派生特征**，
#     每次运行现算，**不再读写** Neo4j 属性 `degree_property`（该键仅保留兼容）。
#   * degree_scope = train_only ⇒ 只数那 80% 训练池，train/val/test 共用同一列（与静态图
#     只用 train_pool 边传播同口径）。因此它**不再**等价于 min_degree 那条入样规则 ——
#     §3.5 里那组泄漏数字（单列 AUC 0.984 / 扣自身边 0.936）是**旧口径**的，本 config 跑出的
#     探针结论必须重新表述。残留泄漏只有"自计数"（训练池里对自己的那条边也计数）。
#   * 本 run **不能**与关闭该开关的 baseline 在 val/test 指标上并列比较；它只回答
#     "度信息有没有用"，绝不能进论文结果表。
#   * X 宽了一列 ⇒ 所有旧 ckpt（含 backbone.pth）失效，必须重训。
#   * source_filter 为空时会扫全库（插补库 10^8 量级关系），代码会打 WARNING。
#
# 运行（换 config 必须显式 -s，见 TechnicalGuide §8；否则会写进 results/gatgru/）：
#   python SampleSetting/run_sampling.py -c gatgru_vec_deg -s gatgru_vec_deg -d cuda:0
# ============================================================

name: GAT-GRU-Vec+Deg
output_subdir: gatgru_vec_deg
static_graph: true

dataset:
  module: Data.company_dataset
  dataloader_type: pyg
  batch_size: 128
  # --- 实验开关（覆盖 common_config.yaml 的同名键，模型文件赢）---
  use_attr_degree: true
  degree_scope: train_only       # 评测期唯一合法的口径（见文件头 / §3.5）
  degree_property: degree        # DEPRECATED：2026-09-17 起既不读也不写（保留兼容）

model:
  module: Models.gatgru_vectorized
  class: BiGRUImputationWithGATVectorized
  kwargs:
    static_hidden_dim: 128
    dynamic_hidden_dim: 64
    num_gat_layers: 2
    num_rnn_layers: 1
    dropout: 0.3
    heads: 4
    time_steps: auto
    device: auto
    use_checkpoint: true
    # 传播方向沿用基线（source_to_target = 聚合供应商/入邻），见 gatgru_vec.yaml
    message_direction: source_to_target

trainer:
  type: standard
  module: Training.trainer_common
  class: DynamicGraphTrainer

analysis:
  predict_interface: node_time
  checkpoint_metrics: [test_f1, test_auc, factset_quantile]
