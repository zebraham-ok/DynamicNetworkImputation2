# ============================================================
# Temp-SEAL model-specific config
# Deep-merged on top of Training/common_config.yaml (Training/config_loader.load_config)
# ============================================================

name: Temp-SEAL
output_subdir: seal
static_graph: true

dataset:
  module: Data.company_dataset
  dataloader_type: pyg
  batch_size: 32

model:
  module: Models.tempseal
  class: SEALWithTemporalWeighting
  kwargs:
    num_features: auto
    hidden_dim: 128
    k_hop: 2
    batch_size: 32
    gcn_dropout: 0.3
    edge_dropout: 0.1
    device: auto
    # Shared node-feature extractor (use_fc_embedding / fc_embed_dim / fc_hidden_dim /
    # fc_num_layers) is inherited from Training/common_config.yaml (model.kwargs).

trainer:
  type: standard
  module: Training.train_dualseal
  class: SEALTrainer
  # NOTE: num_epochs is deliberately NOT set here. It is inherited from
  # Training/common_config.yaml (trainer.num_epochs, currently 60) and acts as a safety ceiling
  # only; the run normally stops earlier through early stopping, so Temp-SEAL is no longer capped
  # at a few epochs (the historical `num_epochs: 2` left it severely under-trained and its metrics
  # were not comparable with the other backbones).
  kwargs:
    use_tensorboard: true
    lr: 0.001
    weight_decay: 0.0001
    grad_clip_norm: 1.0
    # Fallback only: the validation split passed in from create_dataloaders takes precedence, and
    # this random_split of the training pool is used only when that split is unavailable.
    val_ratio: 0.1
    # NOTE: patience is deliberately NOT set here either. Both trainers resolve the early-stopping
    # budget from ONE key in Training/common_config.yaml: trainer.selection.patience (currently 15).
    # The former top-level trainer.patience was removed on 2026-09-12 and is no longer read (when the
    # key is left empty the built-in EARLY_STOP_PATIENCE_DEFAULT = 10 applies, with a warning).
    # SEALTrainer counts it in EPOCHS without a new best step-level selection F1 (the same quantity
    # that drives its checkpoint).
    # LR schedule (ReduceLROnPlateau on the step-level selection metric). lr_patience counts
    # EVALUATIONS (one every periodic_eval_records records), not epochs, and a reduction needs
    # strictly more evaluations than lr_patience. train() prints a warning when the epoch budget is
    # too small for lr_patience to ever trigger.
    lr_patience: 8
    lr_factor: 0.5
    periodic_eval_records: 32000  # evaluate once every 32000 records (equivalent to every 1000 steps at batch_size=32)

analysis:
  predict_interface: data_node_time
  checkpoint_metrics: [test_precision, test_recall]
  batch_size: 32
