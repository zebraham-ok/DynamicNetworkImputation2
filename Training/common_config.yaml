# ============================================================
# Shared configuration for all models (common_config.yaml)
# Each model can override same-named parameters in Models/configs/{model}.yaml
# (deep merge, per key: Training/config_loader.load_config; model-specific keys win)
# ============================================================

# --- Data ---
dataset:
  train_ratio: 0.8                  # training set ratio
  negative_ratio: 1                 # negative-to-positive sample ratio
  min_degree: 2                     # node min-degree filter
  source_filter: semi               # data source filter (semi: semiconductor supply chain only)
  other_possible_fill: 0.0          # experimental fill parameter (0.0=original, 0.5=experimental)

  # Negative sampling control
  filter_factset_neg: false         # whether dynamic negative sampling avoids factset edges (True=avoid, False=allow)
  intra_industry_neg: true          # whether to use intra-industry negative sampling
  use_pred_neg: true                # whether to use predefined negative samples

  # --- Node feature construction (single switch for the whole pipeline) ---
  # When true, one-hot blocks of the categorical attributes below are concatenated to the
  # dense text embedding, i.e. X = [embedding | one-hot(country) | one-hot(industry_2nd) | ...].
  # Combined with the shared feature extractor (model.kwargs.use_fc_embedding) this turns the
  # projection into a real dimensionality reduction instead of a 128 -> 128 re-encoder.
  # Attribute names must match the Neo4j schema of the graph being read (anonymised releases
  # may use different property names). The vocabulary is derived from the data at load time;
  # a missing / empty attribute is encoded as an all-zero row of its block (no <NA> category).
  use_attr_onehot: true
  onehot_attrs:
    - country
    - industry_2nd
    - category_3rd

# --- Model architecture: the parts shared by every backbone ---
# Inherited by every Models/configs/{model}.yaml through the deep merge, so the shared node-feature
# extractor has exactly ONE editable location. A model that needs a different extractor re-declares
# the same key in its own YAML and wins (same-key merge: model file overrides common).
# The values below equal the NodeFeatureExtractor defaults in Models/common.py
# (fc_hidden_dim: null -> fc_embed_dim * 2), so even a consumer that reads a model YAML without
# merging this file builds the identical module.
model:
  kwargs:
    use_fc_embedding: true          # enable the shared node-feature extractor
    fc_embed_dim: 128               # output width handed to each model's spatial encoder
    fc_hidden_dim: 256              # hidden width of the extractor MLP (= fc_embed_dim * 2)
    fc_num_layers: 3                # number of linear layers in the extractor MLP

# --- Debug ---
toy_mode: false                     # enable toy mode (quick validation on a small amount of data)

# --- Trainer ---
# Model configs should NOT cap this per model: num_epochs is only a ceiling that guarantees the run
# terminates, while the effective stopping rule is the early-stopping budget below.
# EARLY STOPPING HAS EXACTLY ONE KNOB: trainer.selection.patience (below), read by both
# DynamicGraphTrainer and SEALTrainer. The former top-level trainer.patience was removed on
# 2026-09-12: nothing reads it any more, and a config that still sets it gets a warning from
# Training/config_loader.py. If selection.patience is left empty, the trainers fall back to their
# built-in default (EARLY_STOP_PATIENCE_DEFAULT = 10 in Training/trainer_common.py) and warn.
trainer:
  num_epochs: 60                    # epoch ceiling (runs normally stop earlier via early stopping)
  max_factset_edges: 5000           # factset sampling cap (null=all)

  # --- Model selection + early stopping: ONE unified criterion (see Training/trainer_common.py) ---
  # score = smooth(metric)                                        when use_factset is false
  # score = 0.5 * smooth(FactSet quantile) + 0.5 * smooth(metric)  when use_factset is true
  # The same score drives the checkpoint AND the early-stopping counter, so the two can no longer
  # disagree. The FactSet quantile is ALWAYS computed and logged (it is reported in the result
  # table); use_factset only decides whether it enters the selection score.
  selection:
    use_factset: false              # false = select on the ranking metric only (FSQ still logged)
    metric: auc                     # auc | f1, computed on the selection split (val when available)
    ema_span: 5                     # exponential-moving-average span; <=1 disables the smoothing
    patience: 15                    # early-stopping budget (epochs); THE ONLY patience knob
                                    # empty -> built-in default 10 (with a warning)
                                    # keep it > lr_schedule.plateau_patience

  # --- Learning-rate schedule (dynamic graph trainer only; SEALTrainer has its own) ---
  # base_lr is the initial learning rate and is honoured even when the schedule is disabled.
  lr_schedule:
    enabled: true
    name: cosine                    # cosine | step | plateau | none
    base_lr: 0.0005                 # initial learning rate
    min_lr: 0.00001                 # lower bound of the schedule
    warmup_epochs: 2                # linear warmup (epochs) towards base_lr
    total_epochs: 20                # cosine period (epochs)
    milestones: [4, 9]              # step schedule: epochs where the lr is multiplied by gamma
    gamma: 0.3                      # step schedule: decay factor
    plateau_factor: 0.3             # plateau schedule: decay factor
    plateau_patience: 3             # plateau schedule: tolerance in EPOCHS (must be < patience)

  kwargs:
    use_tensorboard: true
    margin_lambda: 0.1              # BCE + MarginRankingLoss weight
    # MarginRankingLoss margin = the required gap between a positive and a negative score
    # (max(0, margin - (p_pos - p_neg))). READ BEFORE CHANGING: every model head ends with a
    # Sigmoid, so the scores live in [0, 1] and the largest achievable gap is exactly 1.0.
    # A margin >= 1.0 can therefore only be met at full saturation (p_pos = 1, p_neg = 0): the
    # hinge never switches off and keeps pushing every pair towards the two corners, which
    # flattens/widens the score tails and costs calibration (Brier, threshold stability).
    # Values such as 0.25 keep it a genuine ranking constraint; 1.0 = historical behaviour.
    margin: 0.5

    # Label smoothing of the BCE term: y' = y * (1 - eps) + (1 - y) * eps.
    # ABSENT OR 0 = OFF (hard labels, the historical behaviour): leaving the key out is the same as
    # writing 0.0, so existing configs keep reproducing their numbers bit-for-bit.
    # Enabling it (0.05 / 0.1 are the useful range) caps the logit scale: the BCE optimum moves from
    # "as saturated as possible" to the finite logit log((1 - eps) / eps) (0.05 -> 2.94, 0.1 -> 2.20),
    # which is what stops the score tails from drifting and pulls the Youden threshold away from
    # ~0.99 (see TechnicalGuide.md 5.1). The ranking loss is NOT smoothed, so with margin > 1 - 2*eps
    # the hinge keeps pushing pairs towards the saturation corners and defeats part of the effect:
    # lower `margin` to at most 1 - 2*eps (e.g. <= 0.9 for eps = 0.05). The trainer warns when the
    # two are not in step.
    label_smoothing: 0.0

# --- Pretrained model loading ---
# If a pretrained model path is provided, its feature extractor (static_encoder/static_gnn)
# is loaded and frozen, while the remaining modules (temporal_encoder/edge_predictor) are retrained
pretrained:
  path: null                        # pretrained model path (null=train from scratch)

# --- Test-set prediction saving (for ROC/AUC curve plotting) ---
# Whenever a best model is (re)written during training, run one full inference pass over the test set
# with that model and save its prediction scores as .npy, together with the Youden's J / F1-max
# thresholds those very scores imply (see TechnicalGuide.md §5.3). False skips both the .npy and the
# threshold records; it changes no training number (nothing here feeds selection or early stopping).
save_test_predictions: true        # true (default) | false

# --- Analysis ---
analysis:
  batch_size: 128                   # batch size for analysis
