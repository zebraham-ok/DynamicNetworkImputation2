# ============================================================
# GAT-GRU-Vectorized (GAT-GRU vectorized version) model-specific config
# Deep-merged on top of Training/common_config.yaml (Training/config_loader.load_config)
# ============================================================

name: GAT-GRU-Vec
output_subdir: gatgru_vec
static_graph: true

dataset:
  module: Data.company_dataset
  dataloader_type: pyg
  batch_size: 128

model:
  module: Models.gatgru_vectorized
  class: BiGRUImputationWithGATVectorized
  kwargs:
    static_hidden_dim: 128
    dynamic_hidden_dim: 64
    num_gat_layers: 2
    num_rnn_layers: 1
    dropout: 0.3
    heads: 4
    time_steps: auto
    device: auto
    use_checkpoint: true
    # --- Direction of the GAT message passing (GATEncoderVectorized.message_direction,
    #     forwarded to PyG's GATConv `flow`) - the two values are the two experiments: ---
    #   source_to_target : messages travel supplier -> customer, so a node aggregates its
    #                      SUPPLIERS (in-neighbours / upstream). DEFAULT - reproduces every
    #                      existing GAT-GRU checkpoint.
    #   target_to_source : messages travel customer -> supplier, so a node aggregates its
    #                      CUSTOMERS (out-neighbours / downstream) - the direction the
    #                      hand-written GCN path (Node-GRU / TNA / EGCN) has always used.
    # Parameter shapes are identical in both cases, so the two runs are directly comparable
    # (same seed, same split); only the aggregation side changes.
    message_direction: source_to_target
    # Shared node-feature extractor (use_fc_embedding / fc_embed_dim / fc_hidden_dim /
    # fc_num_layers) is inherited from Training/common_config.yaml (model.kwargs).

trainer:
  type: standard
  module: Training.trainer_common
  class: DynamicGraphTrainer

analysis:
  predict_interface: node_time
  checkpoint_metrics: [test_f1, test_auc, factset_quantile]
