# ============================================================
# GAT-GRU* (2-layer BiGRU) + degree channel
# 实验 A（唯一变量）：dataset.use_attr_degree = true -> X 末尾多一列 log(1+degree)
# Deep-merged on top of Training/common_config.yaml (Training/config_loader.load_config)
# ============================================================
# 2026-09-16 二次更新：度通道已改回 common_config.yaml 的默认 **关闭**（opt-in），
# 因此本 config **再次**是唯一的度开关：与基线 gatgru_2layer.yaml 只差 `use_attr_degree`。
# 它是"标签可分离性探针"，不是可选模型（泄漏实测：单列 min(log1p(deg_u),log1p(deg_v)) 当分数
# 就有 AUC 0.984，而本模型 0.975(ftf)/0.9885(fff)，增益全部由这一列解释；
# 见 common_config.yaml 该键注释与 TechnicalGuide §3.5）。绝不能进论文结果表。
#
# 与 gatgru_2layer.yaml 的差别只有一处：`dataset.use_attr_degree: true`
#   X = [embedding(128) | one-hot(...) | log1p(degree)] = 701 -> 702
# 基线的 GAT-GRU*（results/四次双模式/ensemble/gatgru2layer/）在四个负采样模式上都不弱于
# 单层，所以用 2 层再跑一遍实验 A，可以顺带看"度信息"在强 backbone 上是否还有增益。
#
# 注意事项（TechnicalGuide.md §3.5，逐条同样适用于这份 config）：
#   * degree = (source,target,year) 三元组两端计数，受 source_filter 约束，与 min_degree 同尺度；
#     2026-09-17 起是**运行期派生特征**，每次运行现算，**不再读写** Neo4j 属性
#     `degree_property`（该键仅保留兼容）。
#   * degree_scope = train_only ⇒ 只数那 80% 训练池且三个 split 共用同一列 ⇒ **不再**等价于
#     min_degree 那条入样规则，文件头那组泄漏数字（AUC 0.984 / 0.936）是旧口径的，探针结论
#     必须重新表述；残留泄漏只有"自计数"。
#   * 不能与未开度通道的 baseline 在 val/test 上并列比较，也不进论文结果表。
#   * X 宽了一列 ⇒ 旧 ckpt / backbone.pth 全部失效，必须重训（含 Phase 1）。
#
# 运行（换 config 必须显式 -s，见 TechnicalGuide §8）：
#   python SampleSetting/run_sampling.py -c gatgru_2layer_deg -s gatgru_2layer_deg -d cuda:0
# ============================================================

name: GAT-GRU*-Vec+Deg
output_subdir: gatgru_2layer_deg
static_graph: true

dataset:
  module: Data.company_dataset
  dataloader_type: pyg
  batch_size: 128
  use_attr_degree: true
  degree_scope: train_only       # 评测期唯一合法的口径（见文件头 / §3.5）
  degree_property: degree        # DEPRECATED：2026-09-17 起既不读也不写

model:
  module: Models.gatgru_vectorized
  class: BiGRUImputationWithGATVectorized
  kwargs:
    static_hidden_dim: 128
    dynamic_hidden_dim: 64
    num_gat_layers: 2
    num_rnn_layers: 2            # <- GAT-GRU* 的定义（1 层是 gatgru_vec）
    dropout: 0.3
    heads: 4
    time_steps: auto
    device: auto
    use_checkpoint: true
    # 传播方向沿用基线（source_to_target = 聚合供应商/入邻）
    message_direction: source_to_target

trainer:
  type: standard
  module: Training.trainer_common
  class: DynamicGraphTrainer

analysis:
  predict_interface: node_time
  checkpoint_metrics: [test_f1, test_auc, factset_quantile]
